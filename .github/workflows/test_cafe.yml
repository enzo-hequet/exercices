name: TestCafe E2E
on: [push]

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Start Server
        run: php -S localhost:8000 -t TD8 &

      - name: Install and Run TestCafe
        run: |
          npm install testcafe
          npx testcafe "chrome:headless" TD8/test_cafe.js