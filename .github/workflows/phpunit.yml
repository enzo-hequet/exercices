name: CI PHP UPJV

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # On active PCOV pour permettre la mesure de couverture (Reporting)
          extensions: mbstring, xml, pcov
          coverage: pcov

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      # 1. Action de LINT (Vérification des erreurs de syntaxe)
      - name: PHP Lint
        run: find src/ -name "*.php" -exec php -l {} \;

      # 2. Exécution des TESTS
      # Ton fichier phpunit.xml s'occupe d'afficher le 100% dans la console
      - name: Run PHPUnit Tests
        run: ./vendor/bin/phpunit

      # 3. CRÉATION DU REPORTING
      # Téléchargeable sur GitHub à la fin du job
      - name: Upload Coverage Report
        if: always() # S'exécute même si un test échoue
        uses: actions/upload-artifact@v4
        with:
          name: reporting-couverture-html
          path: coverage-report/