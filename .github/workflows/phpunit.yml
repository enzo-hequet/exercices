name: CI PHP UPJV

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          # On active PCOV pour avoir le rapport de couverture à 100%
          extensions: mbstring, xml, pcov
          coverage: pcov

      - name: Install Dependencies
        run: composer install --no-progress --prefer-dist

      # 1. Action de LINT (Vérification des erreurs de syntaxe)
      - name: PHP Lint
        run: find src/ -name "*.php" -exec php -l {} \;

      # 2. Exécution des TESTS et REPORTING (Objectif 100%)
      - name: Run PHPUnit Tests
        run: ./vendor/bin/phpunit --coverage-text